var unlocked = false;



// hover sfx


//click sfx
button.addEventListener("click", function(event) {
  event.preventDefault();
  var link = button.querySelector("a");
  if (unlocked) {
    var sfx2 = audio2.cloneNode();
    sfx2.volume = 0.5;
    sfx2.play();
    sfx2.addEventListener("ended", function() {
      window.location.href = link.href;
    });
  } else {
    window.location.href = link.href; 
  }
});

</script>
