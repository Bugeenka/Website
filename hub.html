<script>
var audio = document.getElementById("uiHoverSound");
var audio2 = document.getElementById("uiClickSound");
var unlocked = false;


//activates audio on page click
document.addEventListener("click", function() {
  if (!unlocked) {
    audio.play().then(() => {
      audio.pause();
      audio.currentTime = 0;
      unlocked = true;
    });
  }
}, { once: true });

// hover sfx
document.querySelectorAll(".nav-button").forEach(function(button) {
  button.addEventListener("mouseenter", function() {
    if (unlocked) {
      var sfx = audio.cloneNode();
      sfx.volume = 0.5;
      sfx.play();
    }
  });

//click sfx
button.addEventListener("click", function(event) {
  event.preventDefault();
  var link = button.querySelector("a");
  if (unlocked) {
    var sfx2 = audio2.cloneNode();
    sfx2.volume = 0.5;
    sfx2.play();
    sfx2.addEventListener("ended", function() {
      window.location.href = link.href;
    });
  } else {
    window.location.href = link.href; 
  }
});
});

</script>
